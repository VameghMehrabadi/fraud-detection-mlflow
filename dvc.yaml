stages:
  generate:
    cmd: python -m src.data.generate
    outs:
      - data/raw/transaction.csv

  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw/transaction.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python -m src.models.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/models/train.py
      - params.yaml
    params:
     - model
     - training
     - metrics
    outs:
     - model/model.joblib
